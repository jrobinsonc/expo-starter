name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC: catches newly disclosed advisories in unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Blocks PRs that introduce dependencies with known high/critical vulnerabilities.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Audits the lockfile only; no install needed. Production dependencies only.
      - run: pnpm audit --prod --audit-level high

