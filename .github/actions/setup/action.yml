name: Setup project
description: Install pnpm and Node.js, restore the pnpm store cache, and install dependencies.

runs:
  using: composite
  steps:
    # Version is read from the "packageManager" field in package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    # Node version is read from .nvmrc; the pnpm store is cached keyed on pnpm-lock.yaml.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

